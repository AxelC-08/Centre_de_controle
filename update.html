<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifer un jeu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Modifer un jeu</h1>
        <p>Remplis les informations connues. Les champs sont facultatifs, sauf le nom.</p>
    </header>

    <main>
        <section class="panel">
            <form action="update.php" method="post">
                <p style="border-bottom: 12px solid, #3a3939;">
                    <label for="idj">ID du jeux <span class="required">*</span></label><br>
                    <input id="idj" name="idj" type="number" required min="1"><br><br>
                </p>
                <p>
                    <label for="name">Modifier le nom du jeu</label><br>
                    <input id="name" name="name" type="text" required maxlength="200">
                </p>

                <p>
                    <label for="players_label">Modifier le nombre de joueurs</label><br>
                    <input id="players_label" name="players_label" type="text" placeholder="Ex. 2-6 ou 4+">
                </p>

                <p>
                    <label for="duration_label">Modifier la durée</label><br>
                    <input id="duration_label" name="duration_label" type="text" placeholder="Ex. 30 min">
                </p>

                <p>
                    <label for="card_label">Modifier le nombre de cartes ou précision</label><br>
                    <input id="card_label" name="card_label" type="text" placeholder="Ex. 54 ou Dépend">
                </p>

                <p>
                    <label for="rating">Modifier la note sur 5</label><br>
                    <input id="rating" name="rating" type="number" min="0" max="5" step="0.5">
                </p>

                <p class="required">
                    * Champs obligatoires
                </p>

                <button type="submit" style="margin-right: 10px;">Enregistrer le jeu</button>
                <a href="index.html">Annuler et revenir au catalogue</a>
            </form>
        </section>
    </main>
</body>
</html>
