<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer un jeu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Supprimer un jeu</h1>
        <p>Choisissez le jeu à supprimer du catalogue.</p>
    </header>

    <main>
        <section class="panel">
            <form action="supp.php" method="post">
                <p>
                    <label for="id">Identifiant *</label><br>
                    <input id="id" name="id" type="number" required min="1">
                </p>

                <p class="required">
                    * Champs obligatoires
                </p>

                <button type="submit" style="margin-right: 10px;">Supprimer le jeu</button>
                <a href="index.html">Annuler et revenir au catalogue</a>
            </form>
        </section>
    </main>
</body>
</html>
