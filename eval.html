<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évaluations & SAE — IUT Paris Cité</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-selector">
        <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="clair">☀️ Clair</option>
            <option value="sombre">🌙 Sombre</option>
            <option value="pariscite">🎓 Paris Cité</option>
        </select>
    </div>

    <main>
        <div class="container">
            <header>
                <h1>📝 Évaluations & SAE</h1>
                <p class="subtitle">
                    <a href="index.html" style="color: var(--accent);">← Retour à l'accueil</a>
                </p>
            </header>

            <!-- ============ ÉVALUATIONS ============ -->
            <section class="eval-section">
                <h2>📚 Évaluations</h2>

                <div class="eval-card">
                    <h3>Aucun contrôle prévu</h3>
                </div>
            </section>

            <!-- ============ SAE / PROJETS ============ -->
            <section class="eval-section">
                <h2>🚀 SAE & Projets</h2>

                <div class="eval-card sae-card">
                    <h3>Aucune SAE prévue</h3>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>Dernière mise à jour : 12 novembre 2023</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
